name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q DayAlarm.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug
        working-directory: DayAlarm
      - run: find . -name "*.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: DayAlarm-apk
          path: DayAlarm/app/build/outputs/apk/debug/
          if-no-files-found: error
